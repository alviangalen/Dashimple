services:
  dashimple:
    build: .
    container_name: dashimple
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=1945
      - NODE_ENV=production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev:/dev:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /:/host/rootfs:ro
    pid: host
